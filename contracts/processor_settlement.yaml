contract:
  name: processor_settlement
  version: 1.0.0
  owner: payments-ops@example.com
  source_system: psp_alpha

delivery:
  method: sftp_pull
  path: /outbound/settlement/
  filename_pattern: 'psp_alpha_settlement_(?P<business_date>\d{8})_(?P<settlement_batch_id>B\d{6})_v(?P<version>\d+)\.csv'
  completion_marker: '{filename}.done'
  checksum_sidecar: '{filename}.sha256'
  cadence: daily
  expected_by: { time: '04:00', timezone: Asia/Karachi }
  business_date_timezone: UTC

format:
  type: csv
  encoding: utf-8
  delimiter: ','
  header: true
  trailer:
    marker: TRAILER
    fields: [row_count, sum_gross_amount_minor, sum_fee_amount_minor, sum_net_amount_minor]

identity:
  file_key:   [source_system, business_date, settlement_batch_id, version]
  record_key: [settlement_batch_id, psp_reference, record_type]

columns:
  - { name: settlement_batch_id, type: string,  nullable: false }
  - { name: psp_reference,       type: string,  nullable: false }
  - { name: merchant_reference,  type: string,  nullable: true, description: "Our ledger_txn_id, if the card company sends it back" }
  - { name: record_type,         type: string,  nullable: false, allowed: [CAPTURE, REFUND, CHARGEBACK, FEE_ADJUSTMENT] }
  - { name: transaction_date,    type: date,    nullable: false }
  - { name: settlement_date,     type: date,    nullable: false }
  - { name: currency,            type: string,  nullable: false, allowed: [USD, EUR, GBP] }
  - { name: gross_amount_minor,  type: integer, nullable: false }
  - { name: fee_amount_minor,    type: integer, nullable: false, min: 0 }
  - { name: net_amount_minor,    type: integer, nullable: false }
  - { name: payout_id,           type: string,  nullable: false }

rules:
  - { id: net_equals_gross_minus_fee, scope: row,  description: "net = gross - fee" }
  - { id: sign_matches_record_type,   scope: row,  description: "CAPTURE > 0; REFUND, CHARGEBACK < 0; FEE_ADJUSTMENT gross = 0" }
  - { id: settlement_not_before_txn,  scope: row,  description: "settlement_date >= transaction_date" }
  - { id: trailer_totals_match,       scope: file, description: "Row count and the three sums equal the TRAILER line" }
  - { id: single_currency_per_batch,  scope: file, description: "All rows in a batch share one currency" }

changes:
  notice_days: 30
  additive: "minor version bump; accepted automatically"
  breaking: "major version bump; requires a pull request to this file"